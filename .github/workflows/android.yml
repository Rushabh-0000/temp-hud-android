name: Temp HUD Build and Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Build with the saved signing key and publish a GitHub Release
        required: true
        type: boolean
        default: true
      bump:
        description: Version increment for a release
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: temp-hud-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GH_TOKEN: ${{ github.token }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PUBLISH_RELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) }}
      RELEASE_BUMP: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]') && 'patch') || inputs.bump || 'patch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'

      - name: Prepare signing key and version
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          secret_count=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -n "${!name:-}" ]]; then secret_count=$((secret_count + 1)); fi
          done

          if [[ "$PUBLISH_RELEASE" == "true" && "$secret_count" -ne 4 ]]; then
            echo "::error::Release publishing requires all four ANDROID_KEYSTORE_* GitHub Actions secrets."
            exit 1
          fi
          if [[ "$secret_count" -ne 0 && "$secret_count" -ne 4 ]]; then
            echo "::error::Signing secrets are incomplete. Set all four secrets or remove the partial set."
            exit 1
          fi

          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            latest="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // empty' || true)"
            if [[ -z "$latest" ]]; then
              version="0.7.3"
            else
              base="${latest#v}"
              if [[ ! "$base" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then base="0.7.3"; fi
              IFS='.' read -r major minor patch <<< "$base"
              case "$RELEASE_BUMP" in
                major) major=$((major + 1)); minor=0; patch=0 ;;
                minor) minor=$((minor + 1)); patch=0 ;;
                *) patch=$((patch + 1)) ;;
              esac
              version="${major}.${minor}.${patch}"
            fi
          else
            version="0.7.3"
          fi

          code=$((1000 + GITHUB_RUN_NUMBER))
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

          key_path="$RUNNER_TEMP/temp-hud-keystore.p12"
          if [[ "$secret_count" -eq 4 ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_path"
            echo "SIGNING_MODE=persistent" >> "$GITHUB_OUTPUT"
          else
            password="$(openssl rand -hex 32)"
            key_alias="temp-hud-ci-only"
            keytool -genkeypair -noprompt \
              -keystore "$key_path" \
              -storetype PKCS12 \
              -storepass "$password" \
              -keypass "$password" \
              -alias "$key_alias" \
              -keyalg RSA -keysize 2048 -validity 30 \
              -dname "CN=Temp HUD CI Test, O=Temp HUD, C=IN"
            echo "ANDROID_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$key_alias" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$password" >> "$GITHUB_ENV"
            # This key is intentionally disposable and never used for a published release.
            echo "SIGNING_MODE=temporary-ci-key" >> "$GITHUB_OUTPUT"
          fi
          chmod 600 "$key_path"
          echo "ANDROID_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build minified and resource-shrunk APK
        run: gradle --no-daemon --stacktrace -PVERSION_NAME="$VERSION_NAME" -PVERSION_CODE="$VERSION_CODE" assembleRelease

      - name: Verify APK signature and compute checksum
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          echo "sha256=$(sha256sum "$apk" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$(stat -c%s "$apk")" >> "$GITHUB_OUTPUT"
          du -h "$apk"
          ls -lh "$apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: temp-hud-${{ github.run_number }}-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

      - name: Publish GitHub Release
        if: ${{ env.PUBLISH_RELEASE == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<EOF
          Temp HUD $RELEASE_TAG

          - Signed, minified, resource-shrunk Android APK
          - Version: $VERSION_NAME
          - Version code: $VERSION_CODE
          - SHA-256: ${{ steps.apk.outputs.sha256 }}
          - APK size: ${{ steps.apk.outputs.size_bytes }} bytes

          This APK was signed with the persistent keystore configured by the repository owner.
          Install it manually using Android's package installer.
          EOF
          gh release create "$RELEASE_TAG" \
            app/build/outputs/apk/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Temp HUD $RELEASE_TAG" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"
