name: Verify Android Release Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: temp-hud-global
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'
      - name: Compile optimized release variant (not published)
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Clean obsolete build artifacts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false and .name != "temp-hud-signing-bootstrap") | .id' |
          while read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            gh api --silent --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" || true
          done
