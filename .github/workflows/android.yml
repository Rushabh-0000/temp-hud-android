name: Verify Android Release Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'

      - name: Create temporary CI-only signing key
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/temp-hud-ci-test.p12"
          password="$(openssl rand -hex 32)"
          key_alias="temp-hud-ci-test"
          keytool -genkeypair -noprompt \
            -keystore "$key_path" \
            -storetype PKCS12 \
            -storepass "$password" \
            -keypass "$password" \
            -alias "$key_alias" \
            -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=Temp HUD CI Test, O=Temp HUD, C=IN"
          chmod 600 "$key_path"
          {
            echo "ANDROID_KEYSTORE_PATH=$key_path"
            echo "ANDROID_KEYSTORE_PASSWORD=$password"
            echo "ANDROID_KEY_ALIAS=$key_alias"
            echo "ANDROID_KEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Build minified, resource-shrunk test release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Upload optimized installable test APK
        uses: actions/upload-artifact@v7
        with:
          name: temp-hud-temperature-only-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1
