name: One-time Release Signing Key Setup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-hud-global
  cancel-in-progress: true

jobs:
  generate-key:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Refuse to create a key while the repository is public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')"
          if [ "$private" != "true" ]; then
            echo "::error::This workflow packages a signing key. Make this repository private first, then run it again."
            exit 1
          fi
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Generate persistent PKCS12 signing key
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/signing-bundle"
          mkdir -p "$out"
          alias="temp-hud-release"
          password="$(openssl rand -hex 32)"
          key="$out/temp-hud-release.p12"
          keytool -genkeypair -noprompt -v \
            -keystore "$key" \
            -storetype PKCS12 \
            -storepass "$password" \
            -keypass "$password" \
            -alias "$alias" \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -dname "CN=Temp HUD Release, OU=Android, O=Temp HUD, L=Kolhapur, ST=Maharashtra, C=IN"
          key_base64="$(base64 -w0 "$key")"
          {
            echo "TEMP HUD RELEASE SIGNING KEY — KEEP THIS PRIVATE"
            echo
            echo "Create these four GitHub Actions repository secrets in Settings > Secrets and variables > Actions."
            echo "Do not commit this file or send its contents in chat."
            echo
            echo "Secret name: ANDROID_KEYSTORE_BASE64"
            echo "$key_base64"
            echo
            echo "Secret name: ANDROID_KEYSTORE_PASSWORD"
            echo "$password"
            echo
            echo "Secret name: ANDROID_KEY_ALIAS"
            echo "$alias"
            echo
            echo "Secret name: ANDROID_KEY_PASSWORD"
            echo "$password"
            echo
            echo "Back up temp-hud-release.p12 somewhere safe. Every future update must use this exact key."
          } > "$out/signing-setup.txt"
          chmod 600 "$out/signing-setup.txt" "$key"
      - name: Upload one-time secret bundle (expires after one day)
        uses: actions/upload-artifact@v7
        with:
          name: temp-hud-signing-bootstrap
          path: ${{ runner.temp }}/signing-bundle/
          if-no-files-found: error
          retention-days: 1
