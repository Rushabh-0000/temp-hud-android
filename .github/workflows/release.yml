name: Release Temp HUD

on:
  workflow_dispatch:
    inputs:
      bump:
        description: How to increment the next release version
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  actions: write

concurrency:
  group: temp-hud-global
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GH_TOKEN: ${{ github.token }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Confirm repository is private
        run: |
          private="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')"
          if [ "$private" != "true" ]; then
            echo "::error::Make this repository private before creating a signed release."
            exit 1
          fi
      - name: Validate signing secrets
        shell: bash
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository Actions secret: $name"
              exit 1
            fi
          done
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.1'
      - name: Calculate version and decode signing key
        id: version
        shell: bash
        run: |
          latest="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // empty' || true)"
          base="${latest#v}"
          if [[ ! "$base" =~ ^[0-9]+.[0-9]+.[0-9]+$ ]]; then base="0.1.0"; fi
          IFS='.' read -r major minor patch <<< "$base"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac
          version="${major}.${minor}.${patch}"
          code=$((1000 + GITHUB_RUN_NUMBER))
          key_path="$RUNNER_TEMP/temp-hud-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "ANDROID_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          echo "version_name=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
      - name: Build signed, optimized release APK
        run: gradle --no-daemon --stacktrace -PVERSION_NAME="$VERSION_NAME" -PVERSION_CODE="$VERSION_CODE" assembleRelease
      - name: Create update metadata
        id: metadata
        shell: bash
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          sha="$(sha256sum "$apk" | awk '{print $1}')"
          printf '{\n  "versionName": "%s",\n  "versionCode": %s,\n  "apkName": "app-release.apk",\n  "apkSha256": "%s",\n  "repository": "%s"\n}\n' "$VERSION_NAME" "$VERSION_CODE" "$sha" "$GITHUB_REPOSITORY" > update.json
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<EOF
          Temp HUD $RELEASE_TAG

          - Signed, minified, resource-shrunk Android release APK
          - Version: $VERSION_NAME
          - Version code: $VERSION_CODE
          - SHA-256: ${{ steps.metadata.outputs.sha256 }}

          Install by opening the APK on Android. Android will ask you to confirm installation.
          EOF
          gh release create "$RELEASE_TAG" \
            app/build/outputs/apk/release/app-release.apk \
            update.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "Temp HUD $RELEASE_TAG" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"
      - name: Delete temporary GitHub Actions artifacts
        if: success()
        shell: bash
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .id' |
          while read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            gh api --silent --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" || true
          done
