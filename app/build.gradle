plugins {
    id 'com.android.application'
}

def releaseStorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")

android {
    namespace = 'com.tempoverlay.mangohud'
    compileSdk = 36
    compileSdkMinor = 1

    defaultConfig {
        applicationId = 'com.tempoverlay.mangohud'
        minSdk = 26
        targetSdk = 36
        versionCode = (project.findProperty('VERSION_CODE') ?: '1').toInteger()
        versionName = (project.findProperty('VERSION_NAME') ?: '0.1.0').toString()
    }
    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        release {
            if (releaseStorePath) {
                storeFile = file(releaseStorePath)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
            if (releaseStorePath) {
                signingConfig = signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.18.0'
}
